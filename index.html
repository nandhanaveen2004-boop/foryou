<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Love ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050008;
    overflow: hidden;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

.container {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    pointer-events: none;
}

h1 {
    font-size: 32px;
    color: #ff69df;
    text-shadow: 0 0 15px #ff00dd;
    margin-bottom: 15px;
}

/* Photo-va innum perusa mattrum size */
.photo-wrapper {
    position: relative;
    width: 280px;
    height: 260px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    /* Face-a center panna object-position use pannalam, thevappatta konjam shift panlam */
    object-position: center 20%; 
    clip-path: path('M 140,40 C 100,-25 0,0 0,85 C 0,165 140,245 140,245 C 140,245 280,165 280,85 C 280,0 180,-25 140,40 Z');
    filter: drop-shadow(0 0 25px #ff00dd);
}

.name {
    margin-top: 15px;
    font-size: 30px;
    color: #fff;
    text-shadow: 0 0 15px #ff00dd;
}

.message {
    margin-top: 8px;
    font-size: 16px;
    color: #ffb8f2;
}

.music {
    position: absolute;
    z-index: 5;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: auto;
}

button {
    padding: 12px 25px;
    border: 1px solid #ff55dd;
    border-radius: 30px;
    background: #a000ff;
    color: white;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 0 20px #ff00dd;
}

button:hover {
    background: #ff00dd;
}

</style>
</head>

<body>

<canvas id="heart"></canvas>

<div class="container">

    <h1>❤️ Buddi</h1>

    <div class="photo-wrapper">
        <img src="photo (2).jpg" class="photo" alt="Our Photo">
    </div>

    <div class="name">
        Priya ❤️
    </div>

    <div class="message">
        You are my favourite person ✨
    </div>

</div>

<div class="music">
    <button onclick="toggleMusic()" id="musicBtn">
        ▶ Play Our Song
    </button>
</div>

<audio id="audioSong" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<script>

const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

let particles = [];
let w, h;
let time = 0;

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    w = window.innerWidth;
    h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createParticles();
}

function heart(t) {
    let x = 16 * Math.pow(Math.sin(t), 3);

    let y = -(13 * Math.cos(t)
    - 5 * Math.cos(2*t)
    - 2 * Math.cos(3*t)
    - Math.cos(4*t));

    // Particle heart-oda size-a innum perusa (spread aagura maathiri) akki irukken
    let scale = Math.min(w, h) * 0.027;

    return {
        x: w / 2 + x * scale,
        y: h / 2 + y * scale
    };
}

function createParticles() {
    particles = [];

    for (let i = 0; i < 1800; i++) {
        let t = Math.random() * Math.PI * 2;
        let p = heart(t);

        particles.apply = particles.push({
            x: Math.random() * w,
            y: Math.random() * h,

            tx: p.x + (Math.random() - 0.5) * 20,
            ty: p.y + (Math.random() - 0.5) * 20,

            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.04 + 0.01,

            color: Math.random() > 0.5
                ? "#ff00ff"
                : "#00ffff"
        });
    }
}

function animate() {
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(0, 0, w, h);

    time += 0.03;

    particles.forEach(p => {
        p.x += (p.tx - p.x) * p.speed;
        p.y += (p.ty - p.y) * p.speed;

        let glow = 0.6 + Math.sin(time + p.x) * 0.4;

        ctx.beginPath();
        ctx.arc(
            p.x,
            p.y,
            p.size * glow,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = p.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = p.color;

        ctx.fill();
    });

    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
}

resize();
window.addEventListener("resize", resize);
animate();

// Music Play / Pause
const song = document.getElementById("audioSong");
const btn = document.getElementById("musicBtn");

function toggleMusic() {
    if (song.paused) {
        song.play().then(() => {
            btn.innerHTML = "⏸ Pause Song";
        }).catch(() => {
            alert("Please check your song.mp3 file!");
        });
    } else {
        song.pause();
        btn.innerHTML = "▶ Play Our Song";
    }
}

</script>

</body>
</html>
